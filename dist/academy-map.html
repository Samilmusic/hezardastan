<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نقشه آوای هزاردستان</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e5d6;font:13px Tahoma,sans-serif}#map{position:relative;height:100dvh;overflow:hidden;direction:ltr}#tiles{position:absolute;inset:0}#tiles img{position:absolute;width:256px;height:256px;max-width:none}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 3px #0005);width:40px;height:52px;z-index:2}.label{position:absolute;left:50%;top:50%;transform:translate(-50%,10px);padding:7px 12px;border-radius:7px;background:#fffef6;color:#193f35;box-shadow:0 2px 8px #0002;font-weight:bold;white-space:nowrap}.controls{position:absolute;left:12px;top:12px;display:grid;gap:4px;z-index:3}button{width:42px;height:42px;background:#fffef8;border:1px solid #b3ac9d;border-radius:7px;font-size:25px;color:#20594f;cursor:pointer}button:disabled{opacity:.5}a.credit{position:absolute;bottom:0;right:0;background:#fffffff0;padding:4px 7px;color:#34584c;font-size:10px;z-index:4}#error{position:absolute;bottom:30px;right:12px;left:12px;padding:8px;background:#fff8e8;color:#55412b;direction:rtl;text-align:center;z-index:3}#error[hidden]{display:none}</style></head><body><main id="map" aria-label="نقشه آموزشگاه در دیزیچه"><div id="tiles"></div><svg class="pin" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50S2 31 2 19a18 18 0 1 1 36 0c0 12-18 31-18 31Z" fill="#20594f" stroke="#fff" stroke-width="2"/><circle cx="20" cy="19" r="6" fill="#e3c58e"/></svg><span class="label">آوای هزاردستان</span><div class="controls"><button id="plus" aria-label="بزرگ‌نمایی">+</button><button id="minus" aria-label="کوچک‌نمایی">−</button></div><p id="error" role="status" hidden>بارگذاری نقشه انجام نشد؛ از «نقشهٔ بزرگ‌تر» استفاده کنید.</p><a class="credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></main><script src="academy-map.js"></script></body></html>
